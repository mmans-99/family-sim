<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Simulator</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #f7f4ee; color: #2b2620; }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    #clock { font-variant-numeric: tabular-nums; margin-bottom: 8px; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    button { font: inherit; padding: 8px 12px; border: 1px solid #4a4036; border-radius: 6px; background: #fff; cursor: pointer; }
    button[aria-pressed="true"] { background: #4a4036; color: #fff; }
    #house { display: block; width: 100%; border: 1px solid #4a4036; border-radius: 6px; background: #f7f4ee; }
    .help { font-size: 0.85rem; color: #5a5147; margin: 6px 0 0; }
    #status { font-size: 0.9rem; margin-bottom: 8px; color: #3d352c; }
    .person { border: 1px solid #4a4036; border-radius: 6px; background: #fff; padding: 8px 10px; margin-top: 8px; }
    .who { margin-bottom: 6px; }
    .needs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
    .need { display: grid; grid-template-columns: 4.6em 1fr 2em; align-items: center; gap: 6px; font-size: 0.85rem; }
    .track { height: 8px; background: #e8e1d6; border-radius: 4px; overflow: hidden; }
    .fill { display: block; height: 100%; }
    .num { text-align: right; font-variant-numeric: tabular-nums; color: #5a5147; }
    .log { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.85rem; color: #3d352c; }
    .log .t { font-variant-numeric: tabular-nums; color: #7a6f62; margin-right: 4px; }
    #away { border: 1px solid #4a4036; border-radius: 6px; background: #fff; padding: 8px 10px; margin-bottom: 8px; font-size: 0.9rem; }
    #away p { margin: 0 0 4px; }
    #away ol { margin: 0 0 6px; padding-left: 1.2em; color: #3d352c; font-size: 0.85rem; }
    .traits { font-size: 0.8rem; color: #5a5147; margin-bottom: 6px; }
    .why { margin: 6px 0 0; font-size: 0.8rem; color: #5b4f40; background: #f3ead8; border-radius: 4px; padding: 4px 6px; }
  </style>
</head>
<body>
  <h1>Family Simulator</h1>
  <div id="clock">Loading…</div>
  <div id="status"></div>
  <section id="away" hidden aria-live="polite">
    <p id="away-text"></p>
    <ol id="away-log"></ol>
    <button id="away-close" type="button">Close</button>
  </section>
  <div id="speeds" class="bar"></div>
  <div id="views" class="bar"></div>
  <canvas id="house"></canvas>
  <div id="camera" class="bar"></div>
  <section id="people" aria-label="The family"></section>
  <p class="help">Drag to move the view. Pinch to zoom. On a computer: drag to move, scroll to zoom. Art: Sierrassets furniture pack. Original character template created by Eris Esra: <a href="https://erisesra.itch.io/character-templates-pack">erisesra.itch.io/character-templates-pack</a>.</p>
  <script type="module" src="src/main.js"></script>
</body>
</html>
