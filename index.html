<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Simulator</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #f7f4ee; color: #2b2620; }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    #clock { font-variant-numeric: tabular-nums; margin-bottom: 8px; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    button { font: inherit; padding: 8px 12px; border: 1px solid #4a4036; border-radius: 6px; background: #fff; cursor: pointer; }
    button[aria-pressed="true"] { background: #4a4036; color: #fff; }
    #house { display: block; width: 100%; border: 1px solid #4a4036; border-radius: 6px; background: #f7f4ee; }
    .help { font-size: 0.85rem; color: #5a5147; margin: 6px 0 0; }
  </style>
</head>
<body>
  <h1>Family Simulator</h1>
  <div id="clock">Loading…</div>
  <div id="speeds" class="bar"></div>
  <div id="views" class="bar"></div>
  <canvas id="house"></canvas>
  <div id="camera" class="bar"></div>
  <p class="help">Drag to move the view. Pinch to zoom. On a computer: drag to move, scroll to zoom. Art: Sierrassets furniture pack.</p>
  <script type="module" src="src/main.js"></script>
</body>
</html>
